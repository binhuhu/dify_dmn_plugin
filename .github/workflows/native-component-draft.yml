name: Native component draft
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  component-and-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts --prefix integrations/dify-native
      - run: npm test --prefix integrations/dify-native
      - run: python -m pip install -r plugin/requirements.txt
      - run: python scripts/stage-native-tool.py /tmp/native-tool
      - name: Verify no Endpoint surface
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('/tmp/native-tool')
          manifest = yaml.safe_load((root / 'manifest.yaml').read_text())
          assert 'endpoints' not in manifest['plugins']
          assert 'endpoint' not in manifest['resource']['permission']
          assert all(not (root / name).exists() for name in ('endpoints', 'editor_static', 'viewer_static'))
          PY
      - run: python scripts/compatibility/dsl_stdio.py /tmp/native-tool /tmp/native-tool-sdk.json

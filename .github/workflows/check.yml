name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned plugin and check dependencies
        run: python3 -m pip install -r plugin/requirements.txt pytest==9.0.2 ruff==0.15.7
      - name: Manifest permission gate and full regression
        run: bash scripts/check.sh

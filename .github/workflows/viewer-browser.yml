name: Viewer browser
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked viewer dependencies
        run: npm ci --ignore-scripts --prefix viewer
      - name: Install pinned Chromium
        run: cd viewer && npx playwright install chromium
      - name: Adapter and DOM regression
        run: npm test --prefix viewer
      - name: Chromium with sandbox enabled
        run: npm run browser --prefix viewer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-browser-evidence
          path: /tmp/structure-viewer-*.png
          if-no-files-found: warn

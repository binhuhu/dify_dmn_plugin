<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>定位与解决 · 结构视图</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div>
        <small>READ ONLY · PHASE / STEP / NODE</small>
        <h1>定位与解决</h1>
      </div>
      <label class="import"
        >导入本地 JSON<input
          id="file"
          type="file"
          accept=".json,application/json" /></label
      ><button id="demo">SYNTHETIC 示例</button>
      <a href="editor/">规则编辑（开发版）</a>
    </header>
    <nav aria-label="流程选择">
      <button data-flow="LOCATE" aria-pressed="true">定位问题</button
      ><button data-flow="SOLVE" aria-pressed="false">解决方案</button
      ><select id="workflow" aria-label="当前流程"></select
      ><span id="scope"></span>
    </nav>
    <div class="notice">
      只读展示，不执行规则或请求接口。文件仅在本页内存读取；链接、哈希与
      source_refs 仅作原文展示，不代表验证或授权。
    </div>
    <div id="source"></div>
    <div id="status" role="status"></div>
    <details id="diagnostics">
      <summary>定义诊断</summary>
      <div id="diagnostic-list"></div>
    </details>
    <div class="toolbar">
      <button id="out" aria-label="缩小">−</button
      ><button id="fit">适应全部</button
      ><button id="in" aria-label="放大">＋</button
      ><button id="actual">100%</button
      ><button id="fit-step">适应当前 Step</button
      ><output id="zoom-level"></output>
      <span>滚轮滚动 · Ctrl/⌘ + 滚轮缩放 · 点击节点查看定义</span>
    </div>
    <div class="workspace">
      <section id="directory" aria-label="Phase Step 目录">
        <label for="search">搜索名称 / ID / ruleID</label
        ><input
          id="search"
          type="search"
          placeholder="查找 Phase、Step、Node 或规则"
        />
        <div id="tree"></div>
      </section>
      <main id="viewport" tabindex="0" aria-label="流程结构画布">
        <div id="canvas"></div>
      </main>
    </div>
    <aside id="drawer" hidden aria-label="节点详情">
      <button id="close">关闭详情 ×</button>
      <div id="detail"></div>
    </aside>
    <footer>
      支持 node-architecture.v2 bundle / structure-view.v1。按 phases[].steps[]
      原始归属排列；跨步骤出口在详情中列出。
    </footer>
    <script src="adapter.js"></script>
    <script src="demo.js"></script>
    <script src="app.js"></script>
  </body>
</html>

identity:
  name: evaluate_stored_table
  author: hu8627
  label:
    en_US: evaluate_stored_table
    zh_Hans: 读存储表
description:
  human:
    en_US: Read one table kept in this plugin's tool storage (saved like a route table, with version history and optimistic checks, not atomic CAS) - a solution's
      P2 acceptance table or a TARGET / TRIAGE policy table (decision-table/v1, evaluated; decision-set/v1 for several models
      in one table, each with its own call status), the per-scene supplement requirements (supplement-requirements/v1 |
      supplement-requirements/v2), the resource-routing targets (resource-targets/v1) or the 定位 scene-topic catalog with its intent → issue type map
      (scene-topic/v1, target.scene.topic, read by scene_id, topic, topic + intent or intent). Optional version / content_sha256
      pin the exact stored version (a missing pin fails, never falls back to the latest).
    zh_Hans: 读插件工具存储里的一张表（与路由表同样存、带版本历史与乐观检查，不提供原子 CAS）：方案的 P2 受理表或定位 / 分诊的策略表（decision-table/v1，求值；一张表多个模型用 decision-set/v1，每个模型各带调用 status）、按场景的补充要求（supplement-requirements/v1 | supplement-requirements/v2）、资源路由目标（resource-targets/v1）或定位的场景与话题目录及诉求 → 问题类型对照（scene-topic/v1，target.scene.topic：按场景号、话题、话题 + 诉求或诉求查）。可选 version / content_sha256 钉住存储里的那一版（不在就失败，不回退最新版）。
  llm: Read or evaluate one stored table of this plugin (P2 acceptance or policy table, decision set, supplement requirements, resource targets, scene-topic catalog). The legacy supplement-requirements/v1 reader also accepts v2 documents; inputs remain {scene_id}.
parameters:
- name: table
  type: string
  required: false
  form: llm
  label:
    en_US: table
    zh_Hans: 表名
  human_description:
    en_US: Stored table name (p2.<app_id>, target.<name> or target.<object>.<judgment>, triage.<name> or triage.<object>.<judgment>, solution.<fact.feature|feature.reality|disposal.strategy|disposal.status>.<scene_id>[.<part>], triage.supplement.requirements, triage.dispatch.resource, target.scene.topic (scene-topic/v1); the old names target.scene_entity, triage.acceptance, supplement.requirements, dispatch.resource are read-only aliases during the transition). Empty = not requested.
    zh_Hans: 存储表名（p2.<方案应用编号>、target.<名称> 或 target.<对象>.<判断>、triage.<名称> 或 triage.<对象>.<判断>、solution.<fact.feature|feature.reality|disposal.strategy|disposal.status>.<场景号>[.<分片>]、triage.supplement.requirements、triage.dispatch.resource、target.scene.topic（scene-topic/v1）；旧名 target.scene_entity、triage.acceptance、supplement.requirements、dispatch.resource 是过渡期只读别名）；空 = 本次不读。
  llm_description: Stored table name; empty means not requested.
- name: format
  type: string
  required: true
  form: form
  label:
    en_US: format
    zh_Hans: 表格式
  human_description:
    en_US: decision-table/v1 | decision-set/v1 | supplement-requirements/v1 | supplement-requirements/v2 | resource-targets/v1 | scene-topic/v1 (fixed in the workflow).
    zh_Hans: decision-table/v1 / decision-set/v1 / supplement-requirements/v1 | supplement-requirements/v2 / resource-targets/v1 / scene-topic/v1（在流程里固定）。
  llm_description: The table format, fixed by the workflow.
- name: inputs_json
  type: any
  required: false
  form: llm
  label:
    en_US: inputs_json
    zh_Hans: inputs_json
  human_description:
    en_US: 'decision-table/v1: {"parameters": {name: {quality, value, source_refs}}, "missing": "BLOCK"|"UNKNOWN", "undeclared": "REFUSE"|"IGNORE"};
      a table parameter takes {"from_table": <the upstream results>, "model": <model key, for a decision set>, "hit": <which output of a COLLECT receipt, from 0>};
      decision-set/v1: the same plus "models": [model keys] (absent = all); supplement-requirements/v1 | supplement-requirements/v2:
      {"scene_id"}; resource-targets/v1: {"resource_id"}; scene-topic/v1: {"scene_id"} | {"topic"} | {"topic", "intent"} | {"intent"}. Object or JSON string.'
    zh_Hans: 'decision-table/v1：{"parameters": {参数: {quality, value, source_refs}}, "missing": "BLOCK"|"UNKNOWN", "undeclared": "REFUSE"|"IGNORE"}；table 参数收 {"from_table": <上一张表的 results>, "model": <决策集的模型键>, "hit": <读 COLLECT 回执的第几份，从 0 起>}；decision-set/v1：同上再加 "models": [模型键]（不写 = 全部）；supplement-requirements/v1 | supplement-requirements/v2：{"scene_id"}；resource-targets/v1：{"resource_id"}；scene-topic/v1：{"scene_id"} | {"topic"} | {"topic", "intent"} | {"intent"}。对象或 JSON 字符串。'
  llm_description: Inputs for the table, object or JSON string.
- name: version
  type: string
  required: false
  form: form
  label:
    en_US: version
    zh_Hans: 钉的版本
  human_description:
    en_US: Optional. Read exactly this stored version (positive integer); missing = FAILED STORED_TABLE_VERSION_MISSING, never the latest. Empty = latest. A published solution workflow pins its tables.
    zh_Hans: 可选。只读存储里的这一版（正整数）；不在 = FAILED STORED_TABLE_VERSION_MISSING，不回退最新版。空 = 读最新版。已发布的方案流程要钉版本。
  llm_description: Optional stored version to pin; empty means latest.
- name: content_sha256
  type: string
  required: false
  form: form
  label:
    en_US: content_sha256
    zh_Hans: 钉的内容摘要
  human_description:
    en_US: Optional. The pinned version's content_sha256 (64 lowercase hex); with version it must match that version, alone it picks the newest of the last 50 versions with this digest.
    zh_Hans: 可选。钉的那一版的 content_sha256（64 位小写十六进制）；和 version 一起写就要对得上那一版，单独写就取最近 50 版里摘要相同的最新一版。
  llm_description: Optional content digest to pin; empty means not pinned.
output_schema:
  type: object
  properties:
    results:
      type: object
    status:
      type: string
      enum:
      - SUCCEEDED
      - NOT_REQUESTED
      - NOT_FOUND
      - BLOCKED
      - FAILED
    result_json:
      type: string
  required:
  - results
  - status
  - result_json
extra:
  python:
    source: tools/evaluate_stored_table.py

identity:
  name: evaluate_json_table
  author: hu8627
  label:
    en_US: Evaluate JSON Table
    zh_Hans: 内置 JSON 决策表
description:
  human:
    en_US: A decision table written in the node itself, evaluated locally; no credentials or service. Takes the small
      json-table-v1 format, and - for trials only - a decision-table/v1 or decision-set/v1 document or one decision
      model, evaluated exactly as a stored table. A table in use belongs in the plugin's storage (evaluate_stored_table).
      Not DMN XML/FEEL (see convert_dmn_xml).
    zh_Hans: 填在节点里的决策表，本地求值，无需密钥或服务。收早期的 json-table-v1；也收存表用的结构（decision-table/v1、decision-set/v1 文档或单个决策模型），求值与读存储表完全一样——这条只作试验用，正式的表存进插件、用读存储表读。不收 DMN XML/FEEL（见标准 DMN XML 转换）。
  llm: Evaluate a table given inline. json-table-v1 answers with its own envelope; a decision-table/v1 or decision-set/v1
    document (trial use) answers with the stored-table envelope and source.kind INLINE. Inspect status.
parameters:
- name: table_json
  type: any
  required: true
  form: form
  label:
    en_US: table_json
    zh_Hans: table_json
  human_description:
    en_US: json-table-v1 model (max 256 KiB), or for trials a decision-table/v1 / decision-set/v1 document or one
      decision model (max 1 MiB); object or JSON object string.
    zh_Hans: json-table-v1 模型（不超过 256 KiB）；或试验用的 decision-table/v1 / decision-set/v1 文档、单个决策模型（不超过 1 MiB）。对象或 JSON 字符串。
  llm_description: The table - json-table-v1, or for trials a stored decision document or model; object or JSON object
    string.
- name: inputs_json
  type: any
  required: true
  form: llm
  label:
    en_US: inputs_json
    zh_Hans: inputs_json
  human_description:
    en_US: Input object or JSON object string, max 256 KiB. For a stored decision structure, the inputs of
      evaluate_stored_table - parameters as records {quality, value, source_refs}.
    zh_Hans: 输入对象或 JSON 字符串，不超过 256 KiB。表是存表用的结构时，入参与读存储表相同：parameters 里每个参数是一条记录 {quality, value, source_refs}。
  llm_description: Input object or JSON object string, max 256 KiB.
- name: expected_sha256
  type: string
  required: false
  form: form
  label:
    en_US: expected_sha256
    zh_Hans: expected_sha256
  human_description:
    en_US: Optional pin - the table's SHA256 (json-table-v1), the document's content_sha256, or a single model's
      model_sha256.
    zh_Hans: 可选的内容钉：json-table-v1 的表摘要；文档的 content_sha256；单个模型的 model_sha256。对不上就不求值。
  llm_description: Optional exact RFC8785 canonical table SHA256 pin.
output_schema:
  type: object
  properties:
    results:
      type: object
      description: Candidate response contract. Inspect status before using outputs.
  required:
  - results
extra:
  python:
    source: tools/evaluate_json_table.py

identity:
  name: route_table_store
  author: hu8627
  label:
    en_US: route_table_store
    zh_Hans: 路由表存取
description:
  human:
    en_US: Read or save a route table in this plugin's tool storage, where evaluate_decision reads it. Put it alone in a
      maintenance app; the route editor endpoint forwards to that app (on AgentHub endpoint storage is not tool storage).
    zh_Hans: 在插件的工具存储里读或存路由表（evaluate_decision 读的就是这里）。单独放进一个「路由表维护」应用；路由表编辑端点经这个应用读写（AgentHub 上端点的存储和工具的存储不互通）。
  llm: Read or save a route table in plugin tool storage. Used only by the route-table maintenance app.
parameters:
- name: op
  type: string
  required: true
  form: llm
  label:
    en_US: op
    zh_Hans: 操作
  human_description:
    en_US: table | history | version | save (the five delivery-chain tables use OPEN for direct save; SIGNED requires draft and publish) | draft | draft_save | draft_discard | publish (0.5.24, the five delivery-chain tables) | vocabulary (0.5.24, the declared value sets, row shapes and table names) | undo (undo a first store under a standard name; version = its head version) | check (the standard-name keys 0.5.19 would see, and the old name's version keys above its head; both empty before a first store and before reinstalling 0.5.19) | usage (what one table holds in plugin storage, by version, with sizes and half-written versions; read-only) | saved (read-only, the copy kept under a save id, body {save_id}) | prune (delete versions below the newest keep once an hour old; keep counts the head's parent chain and versions off it are kept; and when asked the version key of a half-written version above the head (an hour old, its parent the head read, named in confirm as [{version, save_id}]); not for the five delivery-chain tables; a capability table keeps its old versions and only clears half-written ones; the first call returns a plan, the second carries its plan_sha256 and deletes) | ledger (read-only, only from this maintenance app; one ledger row per stored version of the table, with its writer) | catalog (read-only, for any app, the light catalog computed from the stored heads; body {parts} with intent_types (default) and/or scenes; answers the parts, each part digest, the source tables with version and content digest, and catalog_version; the table parameter is not read) | bundle / bundle_check / bundle_save / bundle_discard / bundle_publish / bundle_rollback (a scene's rows in the six scene tables as one bundle; the table parameter carries the scene id, e.g. M_P_01_01_01; see the scene_bundle tool)
    zh_Hans: table（当前版）/ history（历史）/ version（某一版）/ save（保存；五张交付链表在 OPEN 模式直接存，SIGNED 模式须草稿与发布）/ draft（读草稿）/ draft_save（存草稿）/ draft_discard（删草稿）/ publish（发布草稿，0.5.24，交付链五张表）/ vocabulary（0.5.24：插件认的取值、行形、表名，一份声明）/ undo（撤销标准名的首存，version 写它当前头版的版本号）/ check（0.5.19 会看到的标准名键，以及旧名头版之上的版本键；首存前、回退装 0.5.19 前都应为空）/ usage（这张表在插件存储里占了什么：各版次、大小、写到一半的版次；只读）/ saved（只读：按存表号读留底，body 写 {save_id}）/ prune（删掉最新 keep 版之前存满 1 小时的旧版次，keep 只数头版父版链上的版次，不在链上的版次不删；要求时也收拾头版之上的版次：存满 1 小时、父版是读到的头版、并在 confirm 里逐版写明 {version, save_id} 的才删，只删版本号那一份；交付链五张表不清理；能力表只收拾半截版次、不删旧版次；第一次调用只返回计划，第二次带上计划摘要 plan_sha256 才删）/ ledger（只读，只从本维护应用：这张表每个存着的版次一行台账行，带写手）/ catalog（只读，任何应用可读：从各表头版现算的轻目录；body 写 {parts}，可选 intent_types（默认）、scenes；返回各部分、各部分摘要、来源表的版次与内容摘要、目录版本；不读表参数）/ bundle、bundle_check、bundle_save、bundle_discard、bundle_publish、bundle_rollback（建场景整包：一个场景在六张表里的行一次校验、一次存；表参数写场景编号，如 M_P_01_01_01；详见 scene_bundle 工具）
  llm_description: table, history, version, save, undo, check, draft, draft_save, draft_discard, publish, vocabulary, usage, saved, prune, ledger, catalog, bundle, bundle_check, bundle_save, bundle_discard, bundle_publish or bundle_rollback.
- name: table
  type: string
  required: false
  form: llm
  label:
    en_US: table
    zh_Hans: 路由表
  human_description:
    en_US: Route table name, default dispatch.route.
    zh_Hans: 路由表名，默认 dispatch.route。
  llm_description: Route table name.
- name: version
  type: string
  required: false
  form: llm
  label:
    en_US: version
    zh_Hans: 版本号
  human_description:
    en_US: For op=version, the version number.
    zh_Hans: op=version 时要读的版本号。
  llm_description: Version number for op=version.
- name: body_json
  type: string
  required: false
  form: llm
  label:
    en_US: body_json
    zh_Hans: 保存内容
  human_description:
    en_US: For op=save, the same JSON body the editor posts (table document plus expected_version).
    zh_Hans: op=save 时的保存内容，和编辑页提交的一样（路由表文档 + expected_version）。
  llm_description: For op=save, the editor's JSON body.
- name: writers
  type: string
  required: false
  form: form
  label:
    en_US: Writers
    zh_Hans: 写手登记
  human_description:
    en_US: "2026-11-13: a fifth kind, AGENT, is a writer that only drafts (draft_save, bundle_save, discard; never publish, undo, prune or a direct save of a scene table). In signed mode a save of target.scene.topic or triage.issue.acceptance carries a writer's signature too. 0.5.28: empty (the default) or the single word OPEN = open mode: no signatures, whoever can run this app writes, the five saved directly; requests carrying a writer (editor endpoint, signing scripts) are refused. 0.5.29: best-effort attribution beside versions and separate undo/discard records. Host user and via are unverified context; only writer_verified means HMAC verification. Historical identity fields are visible only through the pinned maintenance app. Writer lines = signed mode. 0.5.27: plain registry, visible in maintenance configuration and DSL exports. Anyone with these keys and maintenance-app invocation access can impersonate any registered writer. Use only when all configuration/export readers may hold every key. Old host caches may persist; republishing does not guarantee immediate revocation. Host upgrade, rotation and rollback remain unverified. One line per writer: <id>:<kind>:<key> (PERSON / SESSION / SCRIPT / APP). Use an independent random high-entropy key of at least 24 characters for each writer."
    zh_Hans: "2026-11-13：种类加 AGENT = 只进草稿的写手（能存草稿、存整包草稿、删草稿；不能发布、撤销、清理，也不能直接存场景的表）；签名模式下场景与话题表、受理条件表的直接存也要写手签名。0.5.28：留空（默认）或只写一个词 OPEN = 开放模式：不签名，能运行本应用的人都能写，五张表直接存；带写手签名的请求（编辑端点、签名脚本）不收。0.5.29：尽力记录版本归属和独立撤销/删草稿操作；宿主用户和 via 均非独立认证，仅 writer_verified 表示 HMAC 核验；历史身份字段只向钉定维护应用返回。有写手行 = 签名模式。0.5.27：普通明文登记，维护配置和 DSL 导出可见全部密钥；有密钥并能调用维护应用的人可冒用任意写手。仅供所有配置及导出查看者都获准持有全部密钥时使用。宿主旧缓存可能保留，重发不保证立即撤权；升级、轮换和回滚仍待宿主验收。一行一个写手：<名字>:<种类>:<密钥>，种类 PERSON / SESSION / SCRIPT / APP；每位写手使用独立、至少 24 字符的随机高熵密钥。"
output_schema:
  type: object
  properties:
    status_code:
      type: number
    result_json:
      type: string
    result:
      type: object
  required:
  - status_code
  - result_json
  - result
extra:
  python:
    source: tools/route_table_store.py

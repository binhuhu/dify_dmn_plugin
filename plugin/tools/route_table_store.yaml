identity:
  name: route_table_store
  author: hu8627
  label:
    en_US: route_table_store
    zh_Hans: 路由表存取
description:
  human:
    en_US: Read or save a route table in this plugin's tool storage, where evaluate_decision reads it. Put it alone in a
      maintenance app; the route editor endpoint forwards to that app (on AgentHub endpoint storage is not tool storage).
    zh_Hans: 在插件的工具存储里读或存路由表（evaluate_decision 读的就是这里）。单独放进一个「路由表维护」应用；路由表编辑端点经这个应用读写（AgentHub 上端点的存储和工具的存储不互通）。
  llm: Read or save a route table in plugin tool storage. Used only by the route-table maintenance app.
parameters:
- name: op
  type: string
  required: true
  form: llm
  label:
    en_US: op
    zh_Hans: 操作
  human_description:
    en_US: table | history | version | save (the five delivery-chain tables use OPEN for direct save; SIGNED requires draft and publish; since 2026-11-18 the scene-topic table target.scene.topic takes only a controlled entry's signed writes in either mode (a save, bundle_publish / bundle_rollback, a prune that deletes its versions); the list and the entries' public keys ship with the release in controlled_tables.json; every other stored table is policy configuration, saved as before) | draft | draft_save | draft_discard | publish (0.5.24, the five delivery-chain tables) | vocabulary (0.5.24, the declared value sets, row shapes and table names) | capability_vocabulary (2026-11-18, the capability table's declaration, with its names support.target.capability.catalog / target.capability.catalog / the read-only old name platform.capability.catalog, the row forms' keys, the spellings of a kind code and a business mode code, the closed sets of how a capability is served; no table, no body) | undo (undo a first store under a standard name; version = its head version) | check (the standard-name keys 0.5.19 would see, and the old name's version keys above its head; both empty before a first store and before reinstalling 0.5.19) | usage (what one table holds in plugin storage, by version, with sizes and half-written versions; read-only) | saved (read-only, the copy kept under a save id, body {save_id}) | prune (delete versions below the newest keep once an hour old; keep counts the head's parent chain and versions off it are kept; and when asked the version key of a half-written version above the head (an hour old, its parent the head read, named in confirm as [{version, save_id}]); not for the five delivery-chain tables; a capability table keeps its old versions and only clears half-written ones; the first call returns a plan, the second carries its plan_sha256 and deletes) | ledger (read-only, only from this maintenance app; one ledger row per stored version of the table, with its writer) | catalog (read-only, for any app, the light catalog computed from the stored heads; body {parts} with intent_types (default) and/or scenes; answers the parts, each part digest, the source tables with version and content digest, and catalog_version; the table parameter is not read) | scene_catalog (2026-11-18, read-only, for any app, the scene light catalog of the scene-topic table, from its head or the version the version parameter names; the table parameter empty for target.scene.topic; each scene's scene_id, name, domain l1 / l2, status and definition, computed at read time from a version that passes the table's own checks; answers the table, version and content digest, so op=version on the same table and version reads the same content; no body) | bundle / bundle_check / bundle_save / bundle_discard / bundle_publish / bundle_rollback (a scene's rows in the six scene tables as one bundle; the table parameter carries the scene id, e.g. M_P_01_01_01; see the scene_bundle tool) | v2_vocabulary (0.5.41, the new writing's words - format v2, the fixed inputs of each role, the by-id path, the id spelling, passthrough, the conclusions part, the filled marks, the new refusal codes, the registered values and the safety lines; no table, no body) | setting (0.5.41, a registered value in plugin storage - solution.v1_writes = ACCEPT (default) or REFUSE, whether solution-layer names still take the old writing v1; no body (or {name}) reads it, for any app; {name, value, note} writes it, only from this maintenance app, in signed mode with a writer's signature; flipping it is not a release) | alias_reads (0.5.43, read-only, for any app - how many reads each old table name has had since this version, per day (UTC), and the final names' table; no table, no body) | deactivate / reactivate (0.5.44, only from this maintenance app, in signed mode with a writer's signature and never an agent's - take a group of 1-16 tables out of use and back; nothing is deleted and no version is made; the body carries tables (each {table, expected_version}), reason and approval_ref to deactivate, tables (each {table, expected_epoch, doc?}), reason and approval_ref to reactivate (the whole group, re-checked against the current head as a save; doc = new content through every gate), abort true and the group id to back out one that broke off; the tables the plugin reads by a fixed or derived name are refused, and a table another table in use names goes only with it) | lifecycle (0.5.44, read-only, for any app - a table's deactivation record and its refused run-time reads; with no table, the tables not ACTIVE now, with the operations and codes)
    zh_Hans: table（当前版）/ history（历史）/ version（某一版）/ save（保存；五张交付链表在 OPEN 模式直接存，SIGNED 模式须草稿与发布；2026-11-18：场景与话题表 target.scene.topic 是场景目录与定义的正本，不论哪种模式都只收受控入口签名的写入——直接存、整包发布与回滚、删它的历史版次都是；受限名单与入口公钥随插件发布，在 controlled_tables.json；其余存表都是策略配置，照旧直接配）/ draft（读草稿）/ draft_save（存草稿）/ draft_discard（删草稿）/ publish（发布草稿，0.5.24，交付链五张表）/ vocabulary（0.5.24：插件认的取值、行形、表名，一份声明）/ capability_vocabulary（2026-11-18：能力表自己的声明——表名 support.target.capability.catalog、存名 target.capability.catalog、只读旧名 platform.capability.catalog，两种行形的键，种类码与业务模式码的写法，「怎么供」各格的取值；不读表参数、不带内容）/ undo（撤销标准名的首存，version 写它当前头版的版本号）/ check（0.5.19 会看到的标准名键，以及旧名头版之上的版本键；首存前、回退装 0.5.19 前都应为空）/ usage（这张表在插件存储里占了什么：各版次、大小、写到一半的版次；只读）/ saved（只读：按存表号读留底，body 写 {save_id}）/ prune（删掉最新 keep 版之前存满 1 小时的旧版次，keep 只数头版父版链上的版次，不在链上的版次不删；要求时也收拾头版之上的版次：存满 1 小时、父版是读到的头版、并在 confirm 里逐版写明 {version, save_id} 的才删，只删版本号那一份；交付链五张表不清理；能力表只收拾半截版次、不删旧版次；第一次调用只返回计划，第二次带上计划摘要 plan_sha256 才删）/ ledger（只读，只从本维护应用：这张表每个存着的版次一行台账行，带写手）/ catalog（只读，任何应用可读：从各表头版现算的轻目录；body 写 {parts}，可选 intent_types（默认）、scenes；返回各部分、各部分摘要、来源表的版次与内容摘要、目录版本；不读表参数）/ scene_catalog（2026-11-18，只读，任何应用可读：场景与话题表的场景轻目录——读头版，或版本参数写的那一版；表参数不写即 target.scene.topic；每个场景的场景号、名称、一级域与二级域、状态、定义，从核过表自身标准的那一版现算；返回表名、版本、内容摘要，按同一表名与版本 op=version 读到的就是同一份内容；不带请求体）/ bundle、bundle_check、bundle_save、bundle_discard、bundle_publish、bundle_rollback（建场景整包：一个场景在六张表里的行一次校验、一次存；表参数写场景编号，如 M_P_01_01_01；详见 scene_bundle 工具）/ v2_vocabulary（0.5.41：新写法的词——格式 v2、各角色的固定输入、按号取的路径、号的字符、直通、结论部分、插件补的标记、新的拒存码、登记值、安全线；不读表参数、不带内容）/ setting（0.5.41：插件存储里的登记值——solution.v1_writes = ACCEPT（照收，默认）或 REFUSE（停收），方案层表名还收不收旧写法 v1；不带内容（或 {name}）是读，任何应用可读；带 {name, value, note} 是翻，只收本维护应用的调用，签名模式下要写手签名；翻开关不发版）/ alias_reads（0.5.43，只读，任何应用可读：本版起各旧表名被读的次数，按天（UTC）记，另带最终名对照；不读表参数、不带内容）/ deactivate、reactivate（0.5.44，只收本维护应用的调用，签名模式下要写手签名、不收 AGENT：一组 1–16 张表停用与恢复；不删表、不出新版次；停用 body 写 tables（每张 {table, expected_version}）、reason、approval_ref，恢复写 tables（每张 {table, expected_epoch, doc?}）、reason、approval_ref（整组恢复，对现在的头版当作再存一次来重核；doc 是新内容，走全套闸），中途断了写 abort 为 true 与组号 group 退回；插件按固定名或派生名读的表不能停用，被在用的表引用着的表要和引用方整组停用）/ lifecycle（0.5.44，只读，任何应用可读：一张表的停用记录与被拒的运行时读次数；不写表名：现在不是 ACTIVE 的表，另带操作与码的词表）
  llm_description: table, history, version, save, undo, check, draft, draft_save, draft_discard, publish, vocabulary, capability_vocabulary, usage, saved, prune, ledger, catalog, scene_catalog, bundle, bundle_check, bundle_save, bundle_discard, bundle_publish, bundle_rollback, v2_vocabulary, setting, alias_reads, deactivate, reactivate or lifecycle.
- name: table
  type: string
  required: false
  form: llm
  label:
    en_US: table
    zh_Hans: 路由表
  human_description:
    en_US: Route table name, default dispatch.route (for op=scene_catalog, default target.scene.topic).
    zh_Hans: 路由表名，默认 dispatch.route（op=scene_catalog 时默认 target.scene.topic）。
  llm_description: Route table name.
- name: version
  type: string
  required: false
  form: llm
  label:
    en_US: version
    zh_Hans: 版本号
  human_description:
    en_US: For op=version, the version number; for op=scene_catalog, the version to read (empty for the head).
    zh_Hans: op=version 时要读的版本号；op=scene_catalog 时要读的那一版（不写读头版）。
  llm_description: Version number for op=version, or for op=scene_catalog (empty for the head).
- name: body_json
  type: string
  required: false
  form: llm
  label:
    en_US: body_json
    zh_Hans: 保存内容
  human_description:
    en_US: For op=save, the same JSON body the editor posts (table document plus expected_version).
    zh_Hans: op=save 时的保存内容，和编辑页提交的一样（路由表文档 + expected_version）。
  llm_description: For op=save, the editor's JSON body.
- name: writers
  type: string
  required: false
  form: form
  label:
    en_US: Writers
    zh_Hans: 写手登记
  human_description:
    en_US: "2026-11-13: a fifth kind, AGENT, is a writer that only drafts (draft_save, bundle_save, discard; never publish, undo, prune or a direct save of a scene table). In signed mode a save of target.scene.topic or triage.issue.acceptance carries a writer's signature too. 0.5.28: empty (the default) or the single word OPEN = open mode: no signatures, whoever can run this app writes, the five saved directly; requests carrying a writer (editor endpoint, signing scripts) are refused. 0.5.29: best-effort attribution beside versions and separate undo/discard records. Host user and via are unverified context; only writer_verified means HMAC verification. Historical identity fields are visible only through the pinned maintenance app. Writer lines = signed mode. 0.5.27: plain registry, visible in maintenance configuration and DSL exports. Anyone with these keys and maintenance-app invocation access can impersonate any registered writer. Use only when all configuration/export readers may hold every key. Old host caches may persist; republishing does not guarantee immediate revocation. Host upgrade, rotation and rollback remain unverified. One line per writer: <id>:<kind>:<key> (PERSON / SESSION / SCRIPT / APP). Use an independent random high-entropy key of at least 24 characters for each writer."
    zh_Hans: "2026-11-13：种类加 AGENT = 只进草稿的写手（能存草稿、存整包草稿、删草稿；不能发布、撤销、清理，也不能直接存场景的表）；签名模式下场景与话题表、受理条件表的直接存也要写手签名。0.5.28：留空（默认）或只写一个词 OPEN = 开放模式：不签名，能运行本应用的人都能写，五张表直接存；带写手签名的请求（编辑端点、签名脚本）不收。0.5.29：尽力记录版本归属和独立撤销/删草稿操作；宿主用户和 via 均非独立认证，仅 writer_verified 表示 HMAC 核验；历史身份字段只向钉定维护应用返回。有写手行 = 签名模式。0.5.27：普通明文登记，维护配置和 DSL 导出可见全部密钥；有密钥并能调用维护应用的人可冒用任意写手。仅供所有配置及导出查看者都获准持有全部密钥时使用。宿主旧缓存可能保留，重发不保证立即撤权；升级、轮换和回滚仍待宿主验收。一行一个写手：<名字>:<种类>:<密钥>，种类 PERSON / SESSION / SCRIPT / APP；每位写手使用独立、至少 24 字符的随机高熵密钥。"
output_schema:
  type: object
  properties:
    status_code:
      type: number
    result_json:
      type: string
    result:
      type: object
  required:
  - status_code
  - result_json
  - result
extra:
  python:
    source: tools/route_table_store.py

identity:
  name: route_table_store
  author: hu8627
  label:
    en_US: route_table_store
    zh_Hans: 路由表存取
description:
  human:
    en_US: Read or save a route table in this plugin's tool storage, where evaluate_decision reads it. Put it alone in a
      maintenance app; the route editor endpoint forwards to that app (on AgentHub endpoint storage is not tool storage).
    zh_Hans: 在插件的工具存储里读或存路由表（evaluate_decision 读的就是这里）。单独放进一个「路由表维护」应用；路由表编辑端点经这个应用读写（AgentHub 上端点的存储和工具的存储不互通）。
  llm: Read or save a route table in plugin tool storage. Used only by the route-table maintenance app.
parameters:
- name: op
  type: string
  required: true
  form: llm
  label:
    en_US: op
    zh_Hans: 操作
  human_description:
    en_US: table | history | version | save (the five delivery-chain tables use OPEN for direct save; SIGNED requires draft and publish) | draft | draft_save | draft_discard | publish (0.5.24, the five delivery-chain tables) | vocabulary (0.5.24, the declared value sets, row shapes and table names) | undo (undo a first store under a standard name; version = its head version) | check (the standard-name keys 0.5.19 would see, and the old name's version keys above its head; both empty before a first store and before reinstalling 0.5.19) | usage (what one table holds in plugin storage, by version, with sizes and half-written versions; read-only) | prune (delete versions below the newest keep, and when asked a half-written version; not for the five delivery-chain tables; the first call returns a plan, the second carries its plan_sha256 and deletes)
    zh_Hans: table（当前版）/ history（历史）/ version（某一版）/ save（保存；五张交付链表在 OPEN 模式直接存，SIGNED 模式须草稿与发布）/ draft（读草稿）/ draft_save（存草稿）/ draft_discard（删草稿）/ publish（发布草稿，0.5.24，交付链五张表）/ vocabulary（0.5.24：插件认的取值、行形、表名，一份声明）/ undo（撤销标准名的首存，version 写它当前头版的版本号）/ check（0.5.19 会看到的标准名键，以及旧名头版之上的版本键；首存前、回退装 0.5.19 前都应为空）/ usage（这张表在插件存储里占了什么：各版次、大小、写到一半的版次；只读）/ prune（删掉最新 keep 版之前的旧版次，要求时也删写到一半的版次；交付链五张表不清理；第一次调用只返回计划，第二次带上计划摘要 plan_sha256 才删）
  llm_description: table, history, version, save, undo, check, draft, draft_save, draft_discard, publish, vocabulary, usage or prune.
- name: table
  type: string
  required: false
  form: llm
  label:
    en_US: table
    zh_Hans: 路由表
  human_description:
    en_US: Route table name, default dispatch.route.
    zh_Hans: 路由表名，默认 dispatch.route。
  llm_description: Route table name.
- name: version
  type: string
  required: false
  form: llm
  label:
    en_US: version
    zh_Hans: 版本号
  human_description:
    en_US: For op=version, the version number.
    zh_Hans: op=version 时要读的版本号。
  llm_description: Version number for op=version.
- name: body_json
  type: string
  required: false
  form: llm
  label:
    en_US: body_json
    zh_Hans: 保存内容
  human_description:
    en_US: For op=save, the same JSON body the editor posts (table document plus expected_version).
    zh_Hans: op=save 时的保存内容，和编辑页提交的一样（路由表文档 + expected_version）。
  llm_description: For op=save, the editor's JSON body.
- name: writers
  type: string
  required: false
  form: form
  label:
    en_US: Writers
    zh_Hans: 写手登记
  human_description:
    en_US: "0.5.28: empty (the default) or the single word OPEN = open mode: no signatures, whoever can run this app writes, the five saved directly; requests carrying a writer (editor endpoint, signing scripts) are refused. 0.5.29: best-effort attribution beside versions and separate undo/discard records. Host user and via are unverified context; only writer_verified means HMAC verification. Historical identity fields are visible only through the pinned maintenance app. Writer lines = signed mode. 0.5.27: plain registry, visible in maintenance configuration and DSL exports. Anyone with these keys and maintenance-app invocation access can impersonate any registered writer. Use only when all configuration/export readers may hold every key. Old host caches may persist; republishing does not guarantee immediate revocation. Host upgrade, rotation and rollback remain unverified. One line per writer: <id>:<kind>:<key> (PERSON / SESSION / SCRIPT / APP). Use an independent random high-entropy key of at least 24 characters for each writer."
    zh_Hans: "0.5.28：留空（默认）或只写一个词 OPEN = 开放模式：不签名，能运行本应用的人都能写，五张表直接存；带写手签名的请求（编辑端点、签名脚本）不收。0.5.29：尽力记录版本归属和独立撤销/删草稿操作；宿主用户和 via 均非独立认证，仅 writer_verified 表示 HMAC 核验；历史身份字段只向钉定维护应用返回。有写手行 = 签名模式。0.5.27：普通明文登记，维护配置和 DSL 导出可见全部密钥；有密钥并能调用维护应用的人可冒用任意写手。仅供所有配置及导出查看者都获准持有全部密钥时使用。宿主旧缓存可能保留，重发不保证立即撤权；升级、轮换和回滚仍待宿主验收。一行一个写手：<名字>:<种类>:<密钥>，种类 PERSON / SESSION / SCRIPT / APP；每位写手使用独立、至少 24 字符的随机高熵密钥。"
output_schema:
  type: object
  properties:
    status_code:
      type: number
    result_json:
      type: string
    result:
      type: object
  required:
  - status_code
  - result_json
  - result
extra:
  python:
    source: tools/route_table_store.py
